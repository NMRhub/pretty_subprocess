[project]
name = "pretty-subprocess"
description = "Show command nicely when subprocess fails"
license = {text = "MIT" }
version = "1.0.1"
dependencies = []
requires-python= ">= 3.12"
readme = "README.md"
authors = [
    {name = "Gerard"},
    {email = "gweatherby@uchc.edu"}
]

[project.urls]
Homepage = "https://github.com/NMRhub/pretty_subprocess.git"

[tool.setuptools]
package-dir = {"" = "src" }  # Tells setuptools that the root package is in the "src" directory

[tool.setuptools.packages.find]
where = ["src"]  # Specify the "src" directory to look for packages


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
